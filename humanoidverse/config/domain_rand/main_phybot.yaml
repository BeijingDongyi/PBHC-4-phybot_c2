# @package _global_
# Full DR for phybot_c2: identical switches/ranges to main.yaml, only the
# body-name lists swapped to phybot's bodies (name == joint name, no _link
# suffix; root is base_link, trunk body is waist_yaw -- torso/neck collapsed)
# and parallel_serial_pd.joint_idx remapped (phybot has no waist roll/pitch).
#
# Intended use (stage 2): finetune from a dr_nil_phybot checkpoint before
# sim2real -- do NOT start motion learning from scratch with this on.

defaults:
  - domain_rand_base

domain_rand:
  reinit_epis_rand: -1

  _push_fixed: true
  push_robots : True
  push_interval_s : [5, 10]
  max_push_vel_xy : 0.1

  randomize_base_com : True
  base_com_range: #kg
      x : [-0.05, 0.05]
      y : [-0.05, 0.05]
      z : [-0.08, 0.08]

  randomize_link_mass : True
  link_mass_range : [0.9, 1.1] # *factor
  randomize_link_com : False
  link_com_range: #m
      x : [-0.01, 0.01]
      y : [-0.01, 0.01]
      z : [-0.01, 0.01]
  randomize_link_body_names : [
      'base_link', 'waist_yaw',
      'left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch',
      'right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch',
      'left_hip_yaw', 'left_hip_roll', 'left_hip_pitch', 'left_knee', 'left_ankle_pitch', 'left_ankle_roll',
      'right_hip_yaw', 'right_hip_roll', 'right_hip_pitch', 'right_knee', 'right_ankle_pitch', 'right_ankle_roll'
  ]

  randomize_link_inertia : True
  link_inertia_range : [0.9,1.1] # *factor
  randomize_link_inertia_names : [
      'base_link', 'waist_yaw',
      'left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch',
      'right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch',
      'left_hip_yaw', 'left_hip_roll', 'left_hip_pitch', 'left_knee', 'left_ankle_pitch', 'left_ankle_roll',
      'right_hip_yaw', 'right_hip_roll', 'right_hip_pitch', 'right_knee', 'right_ankle_pitch', 'right_ankle_roll'
  ]

  heavy_upper:
    enable: False
    ratio: 1.1 # all mass and inertia are scaled by this ratio
    body_names: [
        'waist_yaw',
        'left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch',
        'right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch',
    ]
  randomize_pd_gain : True
  kp_range : [0.9, 1.1]
  kd_range : [0.8, 1.2]

  parallel_serial_pd:
    # multiplicative composition with randomize_pd_gain, not replacing it
    enable: False
    ratio: [0.8, 1.2]
    joint_idx: [4,5, 10,11] # phybot ankle pitch/roll pairs; g1's waist roll/pitch (13,14) don't exist here

  randomize_friction : True
  friction_range : [0.2, 1.2]
  randomize_restitution : False
  restitution_range : [0.0, 1.0]

  randomize_base_mass : True
  # 承载体: phybot 没有 pelvis/torso_link。waist_yaw 在 collapse_fixed_joints 后
  # 吸收了 torso(7.895)+neck(2.789), 共 10.89kg, 是真正的躯干, 语义上对应 g1 的 torso_link。
  # 不能用 base_link(仅 3.24kg, 且是骨盆) —— [-5,5] 会让它变成负质量。
  base_mass_link : waist_yaw
  added_mass_range : [-5., 5.] # kg, 加性负载; waist_yaw 10.89kg -> [5.89, 15.89]

  randomize_torque_rfi : True
  use_rao : True
  rao_lim : 0.05
  rfi_lim : 0.05
  randomize_rfi_lim : True
  rfi_lim_range : [0.5, 1.5]

  randomize_ctrl_delay : True
  ctrl_delay_step_range : [0, 2] # integer max real delay is 90ms

  randomize_motion_ref_xyz: False # head only for now
  motion_ref_xyz_range : [[-0.02, 0.02],[-0.02, 0.02],[-0.1, 0.1]]

  motion_package_loss: False
  package_loss_range: [1, 10] # dt = 0.02s, delay for 0.02s - 0.2s
  package_loss_interval_s : 2

  born_offset : False
  born_offset_curriculum: False
  born_offset_level_down_threshold: 50
  born_offset_level_up_threshold: 120
  level_degree: 0.00005
  born_distance : 0.25
  born_offset_range: [0.0, 1]
  born_offset_possibility : 1.0

  born_heading_curriculum: False
  born_heading_randomization : False
  born_heading_level_down_threshold: 50
  born_heading_level_up_threshold: 120
  born_heading_degree: 10
  born_heading_range: [0, 180]
  born_heading_level_degree: 0.00005
