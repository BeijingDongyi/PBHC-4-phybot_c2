# @package _global_
# phybot_c2, 21 DoF (left leg 6, right leg 6, waist_yaw, left arm 4, right arm 4).
# Modeled on g1/g1_23dof_lock_wrist.yaml. phybot naming: joint name == link name
# (no _joint/_link suffixes). Root body is base_link; URDF fixed links
# torso/neck_yaw/neck_pitch collapse away in IsaacGym -> 22 bodies.
#
# PD gains, default_joint_angles and standing height agree between the two
# authoritative sources (checked 2026-07-06):
#   legged_gym_imitation/legged_gym/envs/phybot_mimic/phybot_mimic_config.py
#   PhybotSoftware_c2/RL_deploy_taichi/config/rl_params.yaml
#
# dof limits (lower/upper/vel/effort) are copied verbatim from the training URDF
# description/robots/phybot_c2/phybot_c2.urdf (left elbow effort fixed 9->58).
# NOTE (sim2real, phase 6): deploy rl_params.yaml torque_limits disagree with the
# URDF at both ankle_roll (9 vs 58) and shoulder_yaw (9 vs 58) -- resolve against
# real motor specs before going to hardware.

defaults:
  - robot_base

robot:
  # Observation parameters
  num_bodies: 22
  dof_obs_size: 21
  actions_dim: 21
  lower_body_actions_dim: 13
  upper_body_actions_dim: 8
  policy_obs_dim: -1
  critic_obs_dim: -1

  key_bodies: ["left_ankle_roll", "right_ankle_roll"]
  contact_bodies: [ "left_ankle_roll", "right_ankle_roll" ]
  num_feet: 2
  right_foot_name: "right_ankle_roll"
  left_foot_name: "left_ankle_roll"
  foot_name: "ankle_roll"
  knee_name: "knee"
  has_torso: True
  torso_name: "waist_yaw"  # no torso body after collapse; waist_yaw is the trunk body
  has_upper_body_dof: True
  dof_names: ['left_hip_pitch', 'left_hip_roll', 'left_hip_yaw', 'left_knee', 'left_ankle_pitch', 'left_ankle_roll',
              'right_hip_pitch', 'right_hip_roll', 'right_hip_yaw', 'right_knee', 'right_ankle_pitch', 'right_ankle_roll',
              'waist_yaw',
              'left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch',
              'right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch']
  upper_dof_names: ['left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch',
                    'right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch']
  upper_left_arm_dof_names: ['left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch']
  upper_right_arm_dof_names: ['right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch']
  lower_dof_names: ['left_hip_pitch', 'left_hip_roll', 'left_hip_yaw', 'left_knee', 'left_ankle_pitch', 'left_ankle_roll',
                    'right_hip_pitch', 'right_hip_roll', 'right_hip_yaw', 'right_knee', 'right_ankle_pitch', 'right_ankle_roll',
                    'waist_yaw']
  waist_dof_names: ['waist_yaw']
  # URDF limits, canonical 21-dof order (verbatim from phybot_c2.urdf)
  dof_pos_lower_limit_list: [-3.05, -0.44, -2.53, -0.05, -1.57, -1.13,
                             -3.05, -3.05, -2.53, -0.05, -1.57, -1.13,
                             -2.62,
                             -3.58, -0.35, -2.53, -2.36,
                             -3.58, -3.05, -2.53, -2.36]
  dof_pos_upper_limit_list: [2.09, 3.05, 2.53, 2.36, 1.57, 1.13,
                             2.09, 0.44, 2.53, 2.36, 1.57, 1.13,
                             2.62,
                             2.01, 3.05, 2.53, 0.0,
                             2.01, 0.35, 2.53, 0.0]
  dof_vel_limit_list: [99.21, 98.9, 98.37, 98.9, 98.37, 98.37,
                       99.21, 98.9, 98.37, 98.9, 98.37, 98.37,
                       98.37,
                       98.37, 98.37, 98.37, 98.16,
                       98.37, 98.37, 98.37, 98.37]
  dof_effort_limit_list: [200.0, 80.0, 58.0, 80.0, 58.0, 58.0,
                          200.0, 80.0, 58.0, 80.0, 58.0, 58.0,
                          58.0,
                          58.0, 58.0, 58.0, 58.0,
                          58.0, 58.0, 58.0, 58.0]

  # only apply for isaacsim  # VERIFY: placeholder 0.03, no phybot measurement yet
  dof_armature_list: [0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
                      0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
                      0.03,
                      0.03, 0.03, 0.03, 0.03,
                      0.03, 0.03, 0.03, 0.03]
  # only apply for isaacsim  # VERIFY: placeholder 0.03, no phybot measurement yet
  dof_joint_friction_list: [0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
                            0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
                            0.03,
                            0.03, 0.03, 0.03, 0.03,
                            0.03, 0.03, 0.03, 0.03]

  body_names: ['base_link',
               'left_hip_pitch', 'left_hip_roll', 'left_hip_yaw', 'left_knee', 'left_ankle_pitch', 'left_ankle_roll',
               'right_hip_pitch', 'right_hip_roll', 'right_hip_yaw', 'right_knee', 'right_ankle_pitch', 'right_ankle_roll',
               'waist_yaw',
               'left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch',
               'right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch']

  # substring-matched against body names (from legged_gym phybot_mimic, minus the
  # collapsed neck_pitch which no longer exists as a body here)
  terminate_after_contacts_on: ["base_link", "hip", "knee", "waist", "shoulder"]
  penalize_contacts_on: ["base_link", "hip", "knee", "waist", "shoulder", "elbow"]
  init_state:
    pos: [0.0, 0.0, 0.75] # x,y,z [m]  (phybot_mimic; verified: kong pkl frame-0 root z=0.733, RSI overrides this anyway)
    rot: [0.0, 0.0, 0.0, 1.0] # x,y,z,w [quat]
    lin_vel: [0.0, 0.0, 0.0]  # x,y,z [m/s]
    ang_vel: [0.0, 0.0, 0.0]  # x,y,z [rad/s]
    default_joint_angles: # = target angles [rad] when action = 0.0 (== phybot_mimic; == motion pkl frame 0 stance)
      left_hip_pitch: -0.1
      left_hip_roll: 0.
      left_hip_yaw: 0.
      left_knee: 0.2
      left_ankle_pitch: -0.1
      left_ankle_roll: 0.
      right_hip_pitch: -0.1
      right_hip_roll: 0.
      right_hip_yaw: 0.
      right_knee: 0.2
      right_ankle_pitch: -0.1
      right_ankle_roll: 0.
      waist_yaw: 0.
      left_shoulder_pitch: 0.
      left_shoulder_roll: 0.1
      left_shoulder_yaw: 0.
      left_elbow_pitch: -0.1
      right_shoulder_pitch: 0.
      right_shoulder_roll: -0.1
      right_shoulder_yaw: 0.
      right_elbow_pitch: -0.1

  control:
    control_type: P
    # PD Drive parameters (legged_gym phybot_mimic == deploy rl_params.yaml):
    # keys are substring-matched against joint names; each key must hit exactly
    # one joint class (the LAST matching key wins in legged_robot_base.py)
    stiffness: # [N*m/rad]
      hip_yaw: 100
      hip_roll: 100
      hip_pitch: 100
      knee: 100
      ankle_pitch: 50
      ankle_roll: 50
      waist_yaw: 20
      shoulder_pitch: 50
      shoulder_roll: 50
      shoulder_yaw: 50
      elbow_pitch: 50

    damping: # [N*m*s/rad]
      hip_yaw: 10
      hip_roll: 10
      hip_pitch: 10
      knee: 10
      ankle_pitch: 5
      ankle_roll: 5
      waist_yaw: 10
      shoulder_pitch: 5
      shoulder_roll: 5
      shoulder_yaw: 5
      elbow_pitch: 5

    # action scale: target angle = actionScale * action + defaultAngle
    action_scale: 0.25  # deploy rl_params.yaml uses 0.25 for every joint
    action_clip_value: 100.0
    clip_torques: True

  asset:
    collapse_fixed_joints: True # merge bodies connected by fixed joints (torso/neck fold into waist_yaw)
    replace_cylinder_with_capsule: True
    flip_visual_attachments: False
    armature: 0.1 # isaacgym armature is set by this
    thickness: 0.01
    max_angular_velocity: 1000.
    max_linear_velocity: 1000.
    density: 0.001
    angular_damping: 0.
    linear_damping: 0.

    urdf_file: "phybot_c2/${robot.asset.robot_type}.urdf"   # asset_root is description/robots
    usd_file: "phybot_c2/${robot.asset.robot_type}.usd"     # not present; isaacsim only
    xml_file: "phybot_c2/${robot.asset.robot_type}.xml"     # not present yet; needed for mujoco sim2sim (phase 6)
    robot_type: phybot_c2
    self_collisions: 0 # 1 to disable, 0 to enable self collisions (phybot_mimic used 0)
    default_dof_drive_mode: 3

    fix_base_link: False # TEST: fix base link to world

  motion:
    motion_lib_type: 'WJX'
    motion_file : ???
    asset:
      assetRoot: "description/robots/phybot_c2/"
      assetFileName: "phybot_fitmotion.xml"

    humanoid_type: phybot_c2
    bias_offset: False
    has_self_collision: True
    has_mesh: False
    has_jt_limit: False
    has_dof_subset: True
    has_upright_start: True
    has_smpl_pd_offset: False
    remove_toe: False # For humanoid's geom toe
    motion_sym_loss: False
    sym_loss_coef: 1
    big_ankle: True

    has_shape_obs: false
    has_shape_obs_disc: false
    has_shape_variation: False

    masterfoot: False
    freeze_toe: false
    freeze_hand: False
    box_body: True
    real_weight: True
    real_weight_porpotion_capsules: True
    real_weight_porpotion_boxes: True

    body_names: ['base_link',
                 'left_hip_pitch', 'left_hip_roll', 'left_hip_yaw', 'left_knee', 'left_ankle_pitch', 'left_ankle_roll',
                 'right_hip_pitch', 'right_hip_roll', 'right_hip_yaw', 'right_knee', 'right_ankle_pitch', 'right_ankle_roll',
                 'waist_yaw',
                 'left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch',
                 'right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch']

    limb_weight_group:
      - ['left_hip_pitch', 'left_hip_roll', 'left_hip_yaw', 'left_knee', 'left_ankle_pitch', 'left_ankle_roll']
      - ['right_hip_pitch', 'right_hip_roll', 'right_hip_yaw', 'right_knee', 'right_ankle_pitch', 'right_ankle_roll']
      - ['base_link', 'waist_yaw']
      - ['left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch']
      - ['right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch']

    dof_names: ['left_hip_pitch', 'left_hip_roll', 'left_hip_yaw', 'left_knee', 'left_ankle_pitch', 'left_ankle_roll',
                'right_hip_pitch', 'right_hip_roll', 'right_hip_yaw', 'right_knee', 'right_ankle_pitch', 'right_ankle_roll',
                'waist_yaw',
                'left_shoulder_pitch', 'left_shoulder_roll', 'left_shoulder_yaw', 'left_elbow_pitch',
                'right_shoulder_pitch', 'right_shoulder_roll', 'right_shoulder_yaw', 'right_elbow_pitch']
    right_foot_name: 'right_ankle_roll'
    left_foot_name: 'left_ankle_roll'

    nums_extend_bodies: 3
    extend_config:
      - joint_name: "left_hand_link"
        parent_name: "left_elbow_pitch"
        pos: [0.0, 0.0, -0.27] # GMR wrist_yaw keypoint; phybot arms hang along -z at zero pose
        rot: [1.0, 0.0, 0.0, 0.0] # w x y z
      - joint_name: "right_hand_link"
        parent_name: "right_elbow_pitch"
        pos: [0.0, 0.0, -0.27]
        rot: [1.0, 0.0, 0.0, 0.0] # w x y z
      - joint_name: "head_link"
        parent_name: "waist_yaw"  # torso is a collapsed fixed link, head hangs off waist_yaw
        pos: [0.0, 0.0, 0.45]     # waist_yaw at z=0.146 -> head ~0.596 above base
        rot: [1.0, 0.0, 0.0, 0.0] # w x y z

    motion_tracking_link:
      - "left_hand_link"
      - "right_hand_link"
      - "head_link"

    lower_body_link:
      - "base_link"
      - "left_hip_pitch"
      - "left_hip_roll"
      - "left_hip_yaw"
      - "left_knee"
      - "left_ankle_pitch"
      - "left_ankle_roll"
      - "right_hip_pitch"
      - "right_hip_roll"
      - "right_hip_yaw"
      - "right_knee"
      - "right_ankle_pitch"
      - "right_ankle_roll"
      - "waist_yaw"

    upper_body_link:
      - "left_shoulder_pitch"
      - "left_shoulder_roll"
      - "left_shoulder_yaw"
      - "left_elbow_pitch"
      - "right_shoulder_pitch"
      - "right_shoulder_roll"
      - "right_shoulder_yaw"
      - "right_elbow_pitch"
      - "left_hand_link"
      - "right_hand_link"
      - "head_link"

    pelvis_link: "base_link"
    base_link: "waist_yaw"
    hips_link:
      - "left_hip_pitch"
      - "left_hip_roll"
      - "left_hip_yaw"
      - "right_hip_pitch"
      - "right_hip_roll"
      - "right_hip_yaw"

    joint_matches:
      - ["base_link", "Pelvis"]
      - ["left_hip_pitch", "L_Hip"]
      - ["left_knee", "L_Knee"]
      - ["left_ankle_roll", "L_Ankle"]
      - ["right_hip_pitch", "R_Hip"]
      - ["right_knee", "R_Knee"]
      - ["right_ankle_roll", "R_Ankle"]
      - ["left_shoulder_roll", "L_Shoulder"]
      - ["left_elbow_pitch", "L_Elbow"]
      - ["left_hand_link", "L_Hand"]
      - ["right_shoulder_roll", "R_Shoulder"]
      - ["right_elbow_pitch", "R_Elbow"]
      - ["right_hand_link", "R_Hand"]
      - ["head_link", "Head"]

    # smpl_pose_modifier intentionally omitted: phybot uses the GMR/LAFAN route,
    # not the SMPL/PHC retarget scripts that consume it (see cfg/robot/phybot_c2.yaml)

    visualization:
      customize_color : True
      marker_joint_colors : # 22 bodies + 3 extend = 25 markers
      - [0.929, 0.867, 0.437] # base_link
      - [0.929, 0.867, 0.437] # left_hip_pitch
      - [0.929, 0.867, 0.437] # left_hip_roll
      - [0.929, 0.867, 0.437] # left_hip_yaw
      - [0.929, 0.867, 0.437] # left_knee
      - [0.929, 0.867, 0.437] # left_ankle_pitch
      - [0.929, 0.867, 0.437] # left_ankle_roll
      - [0.929, 0.867, 0.437] # right_hip_pitch
      - [0.929, 0.867, 0.437] # right_hip_roll
      - [0.929, 0.867, 0.437] # right_hip_yaw
      - [0.929, 0.867, 0.437] # right_knee
      - [0.929, 0.867, 0.437] # right_ankle_pitch
      - [0.929, 0.867, 0.437] # right_ankle_roll
      - [0.929, 0.867, 0.437] # waist_yaw
      - [0.929, 0.867, 0.437] # left_shoulder_pitch
      - [0.929, 0.867, 0.437] # left_shoulder_roll
      - [0.929, 0.867, 0.437] # left_shoulder_yaw
      - [0.929, 0.867, 0.437] # left_elbow_pitch
      - [0.929, 0.867, 0.437] # right_shoulder_pitch
      - [0.929, 0.867, 0.437] # right_shoulder_roll
      - [0.929, 0.867, 0.437] # right_shoulder_yaw
      - [0.929, 0.867, 0.437] # right_elbow_pitch
      - [0, 0.351, 0.613] # left_hand_link (extend)
      - [0, 0.351, 0.613] # right_hand_link (extend)
      - [0, 0.351, 0.613] # head_link (extend)
